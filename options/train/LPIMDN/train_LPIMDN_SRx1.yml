# general settings
name: 806_LPIMDN_SRx1_LicensePlate
model_type: SRModel
scale: 1
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 0

# dataset and data loader settings
datasets:
  train:
    name: LicensePlate_Train
    type: PairedImageDataset
    dataroot_gt: /content/drive/MyDrive/license_plate_dataset/license_plate_sr/lmdb/train_HR.lmdb
    dataroot_lq: /content/drive/MyDrive/license_plate_dataset/license_plate_sr/lmdb/train_LR.lmdb
    io_backend:
      type: lmdb

    gt_size: 48
    use_hflip: false
    use_rot: false

    # data loader
    num_worker_per_gpu: 8  # Tối đa hóa CPU đa luồng trên Colab
    batch_size_per_gpu: 64  # LP-IMDN siêu nhẹ (~0.70M params), batch 64 chạy cực nhanh
    dataset_enlarge_ratio: 1
    prefetch_mode: cuda
    pin_memory: true

  val:
    name: LicensePlate_Val
    type: PairedImageDataset
    dataroot_gt: /content/drive/MyDrive/license_plate_dataset/license_plate_sr/lmdb/val_HR.lmdb
    dataroot_lq: /content/drive/MyDrive/license_plate_dataset/license_plate_sr/lmdb/val_LR.lmdb
    io_backend:
      type: lmdb

# network structures
network_g:
  type: LPIMDN
  in_nc: 3
  nf: 64
  num_modules: 6
  out_nc: 3
  upscale: 1

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~
  experiments_root: /content/drive/MyDrive/license_plate_dataset/license_plate_sr/experiments

# training settings
train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 5e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [20000, 32000]
    gamma: 0.5

  total_iter: 38000  # 100 epochs (24,468 images / batch 64 * 100 epochs ~ 38,200 iters)
  warmup_iter: -1  # no warm up

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

  perceptual_opt:
    type: PerceptualLoss
    layer_weights:
      'conv5_4': 1.0
    vgg_type: vgg19
    use_input_norm: true
    range_norm: false
    perceptual_weight: !!float 0.1
    style_weight: 0
    criterion: l1

# validation settings
val:
  val_freq: !!float 1e8  # Không validate giữa chừng, chỉ validate 1 lần duy nhất ở epoch cuối cùng
  save_img: false
  pbar: true

  metrics:
    psnr:
      type: calculate_psnr_pt
      crop_border: 2
      test_y_channel: true
      better: higher
    ssim:
      type: calculate_ssim_pt
      crop_border: 2
      test_y_channel: true
      better: higher

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 1e8  # Chỉ lưu latest và checkpoint cuối cùng, không lưu rác nhiều file pth
  use_tb_logger: true
  wandb:
    project: license_plate_sr
    entity: anhlone3
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500

# command
# python basicsr/train.py -opt options/train/LPIMDN/train_LPIMDN_SRx1.yml
