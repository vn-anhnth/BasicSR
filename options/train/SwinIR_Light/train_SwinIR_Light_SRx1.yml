name: 921_SwinIR_Light_SRx1_LicensePlate
model_type: SwinIRModel
scale: 1
num_gpu: 1
manual_seed: 0
datasets:
  train:
    name: LicensePlate_Train
    type: PairedImageDataset
    dataroot_gt: /content/drive/MyDrive/license_plate_dataset/license_plate_sr/lmdb/train_HR.lmdb
    dataroot_lq: F:/license_plate_dataset/license_plate_sr/lmdb/train_LR.lmdb
    io_backend:
      type: lmdb
    gt_size: 48
    use_hflip: false
    use_rot: false
    num_worker_per_gpu: 8
    batch_size_per_gpu: 64
    dataset_enlarge_ratio: 1
    prefetch_mode: cuda
    pin_memory: true
  val:
    name: LicensePlate_Val
    type: PairedImageDataset
    dataroot_gt: /content/drive/MyDrive/license_plate_dataset/license_plate_sr/lmdb/val_HR.lmdb
    dataroot_lq: F:/license_plate_dataset/license_plate_sr/lmdb/val_LR.lmdb
    io_backend:
      type: lmdb
network_g:
  type: SwinIR
  upscale: 1
  in_chans: 3
  img_size: 48
  window_size: 4
  img_range: 1.0
  depths:
  - 6
  - 6
  - 6
  - 6
  embed_dim: 60
  num_heads:
  - 6
  - 6
  - 6
  - 6
  mlp_ratio: 2
  upsampler: pixelshuffledirect
  resi_connection: 1conv
path:
  pretrain_network_g: null
  strict_load_g: true
  resume_state: null
  experiments_root: /content/drive/MyDrive/license_plate_dataset/license_plate_sr/experiments
train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: 0.0005
    weight_decay: 0
    betas:
    - 0.9
    - 0.99
  scheduler:
    type: MultiStepLR
    milestones:
    - 20000
    - 32000
    gamma: 0.5
  total_iter: 38000
  warmup_iter: -1
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
val:
  val_freq: 100000000.0
  save_img: false
  pbar: true
  metrics:
    psnr:
      type: calculate_psnr_pt
      crop_border: 2
      test_y_channel: true
      better: higher
    ssim:
      type: calculate_ssim_pt
      crop_border: 2
      test_y_channel: true
      better: higher
logger:
  print_freq: 100
  save_checkpoint_freq: 3800.0
  use_tb_logger: true
  wandb:
    project: license_plate_sr
    entity: anhlone3
    resume_id: null
dist_params:
  backend: nccl
  port: 29500
