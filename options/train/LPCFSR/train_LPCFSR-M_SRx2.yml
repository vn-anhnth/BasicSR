# general settings
name: 906_LPCFSR_SRx2_LicensePlate
model_type: SRModel
scale: 2
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 0

# dataset and data loader settings
datasets:
  train:
    name: LicensePlate_Train
    type: PairedImageDataset
    dataroot_gt: F:/license_plate_dataset/license_plate_sr/lmdb/train_HR.lmdb
    dataroot_lq: F:/license_plate_dataset/license_plate_sr/lmdb/train_LR_x2.lmdb
    io_backend:
      type: lmdb

    gt_size: 48
    use_hflip: false
    use_rot: false

    # data loader
    num_worker_per_gpu: 0  # Tránh lỗi Paging file trên Windows (Colab dùng 8)
    batch_size_per_gpu: 64  # RTX 3060 12GB (hoặc Colab T4/A100)
    dataset_enlarge_ratio: 1
    prefetch_mode: ~
    pin_memory: true

  val:
    name: LicensePlate_Val
    type: PairedImageDataset
    dataroot_gt: F:/license_plate_dataset/license_plate_sr/lmdb/val_HR.lmdb
    dataroot_lq: F:/license_plate_dataset/license_plate_sr/lmdb/val_LR_x2.lmdb
    io_backend:
      type: lmdb

# network structures
network_g:
  type: LPCFSR
  in_chans: 3
  embed_dim: 48
  depths: [6, 6]
  dw_size: 7
  mlp_ratio: 2
  bottleneck_dim: 16
  upscale: 2
  img_range: 1.0

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 5e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [20000, 32000]
    gamma: 0.5

  total_iter: 38000  # 100 epochs (24,468 images / batch 64 * 100 epochs ~ 38,000 iters)
  warmup_iter: -1  # no warm up

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

# validation settings
val:
  val_freq: !!float 3800  # Luu va danh gia moi 10 epochs
  save_img: false
  pbar: true

  metrics:
    psnr:
      type: calculate_psnr_pt
      crop_border: 2
      test_y_channel: true
      better: higher
    ssim:
      type: calculate_ssim_pt
      crop_border: 2
      test_y_channel: true
      better: higher

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 3800  # Luu checkpoint moi 10 epochs (3,800 iters)
  use_tb_logger: true
  wandb:
    project: license_plate_sr
    entity: anhlone3
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500

# command
# python basicsr/train.py -opt options/train/LPCFSR/train_LPCFSR_SRx2.yml
